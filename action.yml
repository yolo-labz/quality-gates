name: 'Quality Gates'
description: 'Deterministic code-slop (aislop + jscpd), alignment, and Gherkin MUST-rule gates on a PR diff. Runtime-LLM-free; the only network is npm ci for the engines.'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  base-ref:
    description: 'Git ref to diff the PR against. Caller must checkout with fetch-depth: 0.'
    required: false
    default: 'origin/main'
  aislop-max-errors:
    description: 'Fail when aislop error count exceeds this.'
    required: false
    default: '0'
  jscpd-max-pct:
    description: 'Fail when copy-paste duplication percentage exceeds this.'
    required: false
    default: '0'
  align-fail-on-todo:
    description: 'Fail on TODO/FIXME/stub/NotImplemented in changed code (1=block, 0=report).'
    required: false
    default: '1'
  align-fail-on-skip:
    description: 'Fail on skipped/.only/disabled tests added (1=block, 0=report).'
    required: false
    default: '1'
  align-fail-on-lint-disable:
    description: 'Fail on added lint-suppressions (eslint-disable/@ts-ignore/noqa/…).'
    required: false
    default: '1'
  align-fail-on-debug:
    description: 'Fail on debug artifacts left in changed code (console.log/debugger/set_trace). Warning-tier by default.'
    required: false
    default: '0'
  align-max-files:
    description: 'Fail if changed code files exceed N (0 = off).'
    required: false
    default: '0'
  gherkin-paths:
    description: 'Space-separated files/dirs to lint for .feature MUST rules. A path that does not exist, or holds no .feature files, is a silent pass — most repos have none by design.'
    required: false
    default: 'features'
  gherkin-fail-on:
    description: 'Lowest severity that fails the build: error (default) or warning. placeholder-data is warning-tier because it is a SHOULD in the contract.'
    required: false
    default: 'error'

runs:
  using: 'composite'
  steps:
    - name: Set up Node (code-slop engines)
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'

    - name: Install code-slop engines (aislop + jscpd)
      shell: bash
      working-directory: ${{ github.action_path }}/code-slop-gate
      run: npm ci

    - name: code-slop gate (anti-slop, on the PR diff)
      shell: bash
      env:
        AISLOP_MAX_ERRORS: ${{ inputs.aislop-max-errors }}
        JSCPD_MAX_PCT: ${{ inputs.jscpd-max-pct }}
      run: '"${{ github.action_path }}/code-slop-gate/code-slop-gate.sh" --base "${{ inputs.base-ref }}"'

    - name: alignment gate (scope + completion, on the PR diff)
      shell: bash
      env:
        ALIGN_FAIL_ON_TODO: ${{ inputs.align-fail-on-todo }}
        ALIGN_FAIL_ON_SKIP: ${{ inputs.align-fail-on-skip }}
        ALIGN_FAIL_ON_LINT_DISABLE: ${{ inputs.align-fail-on-lint-disable }}
        ALIGN_FAIL_ON_DEBUG: ${{ inputs.align-fail-on-debug }}
        ALIGN_MAX_FILES: ${{ inputs.align-max-files }}
      run: '"${{ github.action_path }}/alignment-gate/alignment-gate.sh" --base "${{ inputs.base-ref }}"'

    # Installed unconditionally rather than behind a "does this repo have
    # scenarios" probe: two packages is cheap, and a detection bug here would
    # surface as a hard tooling error (exit 2) in repos that DO have scenarios.
    # The gate's own deps check stays as the safety net, not as the common path.
    - name: Install Gherkin parser
      shell: bash
      working-directory: ${{ github.action_path }}/gherkin-lint
      run: npm ci

    - name: gherkin gate (MUST rules on .feature files)
      shell: bash
      env:
        GHERKIN_PATHS: ${{ inputs.gherkin-paths }}
        GHERKIN_FAIL_ON: ${{ inputs.gherkin-fail-on }}
      run: '"${{ github.action_path }}/gherkin-lint/gherkin-lint-gate.sh"'
